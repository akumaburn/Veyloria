# ============================================================
# Veyloria Quarkus Configuration
# ============================================================
# Override any property via environment variables using the
# standard Quarkus mapping: dots→underscores, uppercase.
# Example: quarkus.http.port → QUARKUS_HTTP_PORT
# Custom properties use chatllm.* prefix.
# ============================================================
# --- Server ---
quarkus.http.port=8300
quarkus.http.host=0.0.0.0
quarkus.http.limits.max-body-size=10M
# Trust X-Forwarded-For/-Proto from the reverse proxy (nginx) so client-IP
# based rate limiting and audit logs see the real client, not the proxy.
# Only enable when the backend is NOT directly internet-exposed.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-forwarded=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://rpg.local:3000}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.cors.exposed-headers=Content-Type

# --- Reactive MySQL ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.reactive.url=mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:chatllm}
quarkus.datasource.username=${DATABASE_USER:chatllm}
quarkus.datasource.password=${DATABASE_PASSWORD:chatllm}
quarkus.datasource.reactive.max-size=${DATABASE_POOL_SIZE:20}
quarkus.datasource.reactive.idle-timeout=PT30S
quarkus.datasource.reactive.reconnect-attempts=3
quarkus.datasource.reactive.reconnect-interval=PT1S

# --- Redis ---
# Database selection is encoded in the URL path (redis://host:port/<db>)
quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}/${REDIS_DATABASE:0}
quarkus.redis.password=${REDIS_PASSWORD:}
quarkus.redis.max-pool-size=${REDIS_POOL_SIZE:10}
quarkus.redis.max-pool-waiting=128

# --- JWT ---
# Custom JWT handling via JWTAuthProvider + GraphQLAuthContext (auth0 java-jwt).
# We intentionally do NOT use quarkus-smallrye-jwt because we need control over
# token creation, refresh tokens, Redis-backed revocation, and per-request
# manual validation in our GraphQL resolvers.
chatllm.jwt.secret=${JWT_SECRET:change-this-secret-in-production}
# Quarkus dev mode must be able to sign tokens without a prepared environment.
# Production still requires JWT_SECRET: the fallback secret above is rejected
# outside dev mode, and a rejected secret stops startup.
%dev.chatllm.jwt.secret=${JWT_SECRET:development-secret-change-in-production}
%dev.chatllm.development-mode=${DEVELOPMENT_MODE:true}
%test.chatllm.jwt.secret=${JWT_SECRET:test-secret-that-is-at-least-32-char-long!!}
%test.chatllm.development-mode=true
chatllm.jwt.issuer=${JWT_ISSUER:chatllm}
chatllm.jwt.access-token-expiry=${JWT_ACCESS_TOKEN_EXPIRY:14400000}
chatllm.jwt.refresh-token-expiry=${JWT_REFRESH_TOKEN_EXPIRY:604800000}
chatllm.jwt.algorithm=HS256

# --- GraphQL ---
quarkus.smallrye-graphql.root-path=/graphql


quarkus.smallrye-graphql.http.get.enabled=true
quarkus.smallrye-graphql.ui.enabled=${ENABLE_GRAPHQL_PLAYGROUND:false}
quarkus.smallrye-graphql.schema-include-scalars=true
quarkus.smallrye-graphql.schema-include-directives=true
# Show full error messages in GraphQL responses (frontend relies on err.message).
# In production, set SHOW_GRAPHQL_ERROR_DETAILS=false to avoid leaking internals.
mp.graphql.showErrorDetails=${SHOW_GRAPHQL_ERROR_DETAILS:true}
# Always show messages from GraphQLException (domain errors like validation,
# rate limiting, auth failures) even when showErrorDetails=false.
mp.graphql.showErrorMessage=org.eclipse.microprofile.graphql.GraphQLException,com.eonmux.chatllm.graphql.auth.AuthException
# Friendlier default when showErrorDetails=false and exception is not in the
# show list. Replaces SmallRye's library default "System error".
mp.graphql.defaultErrorMessage=An unexpected error occurred. Please try again.
# Include structured error extensions (code, classification, plus custom rateLimit).
# Without this list, SmallRye omits the entire extensions block, so @ErrorCode and
# ErrorExtensionProvider fields like retryAfterSeconds never reach the client.
mp.graphql.errorExtensionFields=code,classification,rateLimit
# Subscriptions: SmallRye serves WebSocket upgrades on the same /graphql path.
# Accept both the legacy "graphql-ws" and the modern "graphql-transport-ws" protocol.
quarkus.smallrye-graphql.websocket-subprotocols=graphql-transport-ws,graphql-ws

# --- Health ---
quarkus.smallrye-health.root-path=/health
# Health extensions auto-enabled by quarkus-smallrye-health

# --- Metrics ---
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics

# --- WebSocket (WebSockets Next extension uses framework defaults) ---

# --- Logging ---
quarkus.log.console.enabled=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.category."com.eonmux.chatllm".level=${LOG_LEVEL:DEBUG}
quarkus.log.category."io.vertx".level=INFO
quarkus.log.category."io.quarkus".level=INFO
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/chatllm.log
quarkus.log.file.rotation.max-file-size=100M
quarkus.log.file.rotation.max-backup-index=10
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

# --- Uber JAR packaging ---
quarkus.package.jar.type=uber-jar

# ============================================================
# Veyloria Custom Configuration (chatllm.* namespace)
# ============================================================

# --- Server ---
chatllm.development-mode=${DEVELOPMENT_MODE:false}
chatllm.uploads-directory=/tmp/uploads
chatllm.environment=${ENVIRONMENT:development}
chatllm.app-version=3.0.0

# --- Security ---
chatllm.allowed-origins=${ALLOWED_ORIGINS:*}
chatllm.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:600}
chatllm.message-rate-limit-per-minute=10
chatllm.login-rate-limit-per-minute=50
chatllm.bcrypt-rounds=12
chatllm.auth-bypass-enabled=${AUTH_BYPASS_ENABLED:false}

# --- LLM Server ---
chatllm.llm.enabled=${LLM_ENABLED:true}
chatllm.llm.mock-mode=${LLM_MOCK_MODE:false}
chatllm.llm.external-server=${LLM_EXTERNAL_SERVER:true}
chatllm.llm.external-base-url=${LLM_EXTERNAL_BASE_URL:http://localhost:8080}
chatllm.llm.external-model=${LLM_EXTERNAL_MODEL:auto}
# Structured roster JSON needs the answer budget, rather than an unbounded reasoning pass.
# Set false for providers that do not support chat_template_kwargs. Normal chats are unaffected.
chatllm.llm.roster-disable-thinking=${LLM_ROSTER_DISABLE_THINKING:true}
# Agent JSON calls (accountant, highlighter, muse, skeptic, caster) also need the
# answer budget. A reasoning pass can consume max_tokens and leave an empty body.
chatllm.llm.agent-json-disable-thinking=${LLM_AGENT_JSON_DISABLE_THINKING:true}
chatllm.llm.prose-disable-thinking=${LLM_PROSE_DISABLE_THINKING:true}
chatllm.llm.external-api-key=${LLM_EXTERNAL_API_KEY:}
# Portable defaults; set explicit paths when using a managed local server.
chatllm.llm.binary-path=${LLM_BINARY_PATH:llama-server}
chatllm.llm.model-path=${LLM_MODEL_PATH:./models/model.gguf}
chatllm.llm.host=${LLM_HOST:127.0.0.1}
chatllm.llm.port=${LLM_PORT:8080}
chatllm.llm.threads=${LLM_THREADS:6}
chatllm.llm.threads-http=${LLM_THREADS_HTTP:-1}

# --- LLM Context & Batching ---
chatllm.llm.context-size=${LLM_CONTEXT_SIZE:256000}
chatllm.llm.batch-size=${LLM_BATCH_SIZE:2048}
chatllm.llm.ubatch-size=${LLM_UBATCH_SIZE:512}
chatllm.llm.parallel-slots=${LLM_PARALLEL_SLOTS:1}

# --- LLM GPU & Memory ---
chatllm.llm.gpu-layers=${LLM_GPU_LAYERS:-1}
chatllm.llm.flash-attn=${LLM_FLASH_ATTN:on}
chatllm.llm.cache-type-k=${LLM_CACHE_TYPE_K:q8_0}
chatllm.llm.cache-type-v=${LLM_CACHE_TYPE_V:q4_0}
chatllm.llm.no-mmap=${LLM_NO_MMAP:false}
chatllm.llm.kv-offload=${LLM_KV_OFFLOAD:true}
chatllm.llm.fit=${LLM_FIT:on}
chatllm.llm.fit-target=${LLM_FIT_TARGET:1024}
chatllm.llm.fit-ctx=${LLM_FIT_CTX:256000}
chatllm.llm.mlock=${LLM_MLOCK:true}
chatllm.llm.repack=${LLM_REPACK:true}
# Keep all MoE expert weights on CPU (saves VRAM on Mixtral/Qwen3-MoE/etc).
chatllm.llm.cpu-moe=${LLM_CPU_MOE:true}
# Keep first N MoE layers on CPU; -1 disables. Mutually exclusive with cpu-moe.
chatllm.llm.n-cpu-moe=${LLM_N_CPU_MOE:-1}
# Tensor-op offload to GPU. Default true; set false to keep ops on host.
chatllm.llm.op-offload=${LLM_OP_OFFLOAD:true}
# KV cache defragmentation threshold (-1 disables). 0.1 = defrag at 10% fragmentation.
chatllm.llm.defrag-thold=${LLM_DEFRAG_THOLD:-1.0}
# RPC backends, comma-separated host:port (e.g. "10.0.0.2:50052,10.0.0.3:50052").
chatllm.llm.rpc=${LLM_RPC:}

# --- LLM Multi-GPU ---
chatllm.llm.device=${LLM_DEVICE:}
chatllm.llm.main-gpu=${LLM_MAIN_GPU:0}
chatllm.llm.split-mode=${LLM_SPLIT_MODE:layer}
chatllm.llm.tensor-split=${LLM_TENSOR_SPLIT:}
chatllm.llm.numa=${LLM_NUMA:}

# --- LLM Prompt Caching ---
chatllm.llm.cache-ram=${LLM_CACHE_RAM:512}
chatllm.llm.cache-reuse=${LLM_CACHE_REUSE:256}
chatllm.llm.kv-unified=${LLM_KV_UNIFIED:false}
chatllm.llm.ctx-checkpoints=${LLM_CTX_CHECKPOINTS:8}
chatllm.llm.swa-full=${LLM_SWA_FULL:false}
chatllm.llm.cache-prompt=${LLM_CACHE_PROMPT:false}

# --- LLM Sampling ---
chatllm.llm.temperature=${LLM_TEMPERATURE:1}
chatllm.llm.top-p=${LLM_TOP_P:0.90}
chatllm.llm.top-k=${LLM_TOP_K:40}
chatllm.llm.min-p=${LLM_MIN_P:0.0}
chatllm.llm.repeat-penalty=${LLM_REPEAT_PENALTY:1.0}
chatllm.llm.max-tokens=${LLM_MAX_TOKENS:256000}
chatllm.llm.presence-penalty=${LLM_PRESENCE_PENALTY:0.0}
chatllm.llm.frequency-penalty=${LLM_FREQUENCY_PENALTY:0.0}
chatllm.llm.repeat-last-n=${LLM_REPEAT_LAST_N:64}
chatllm.llm.top-n-sigma=${LLM_TOP_N_SIGMA:-1.0}
chatllm.llm.typical-p=${LLM_TYPICAL_P:1.0}
# RNG seed; -1 uses a random seed each request.
chatllm.llm.seed=${LLM_SEED:-1}
# Tokens to keep from the initial prompt when the context window fills; -1 = all.
chatllm.llm.keep=${LLM_KEEP:-1}
# Ignore end-of-sequence token (continue generating past natural stop).
chatllm.llm.ignore-eos=${LLM_IGNORE_EOS:false}
# Dynamic temperature: range around base temperature, exponent shapes the curve.
chatllm.llm.dynatemp-range=${LLM_DYNATEMP_RANGE:0.0}
chatllm.llm.dynatemp-exp=${LLM_DYNATEMP_EXP:1.0}

# --- LLM Sampling (Constrained / Advanced) ---
# Per-token logit bias, format "tok+bias,tok-bias,..." (see llama-server docs).
chatllm.llm.logit-bias=${LLM_LOGIT_BIAS:}
# GBNF grammar (inline string) or path to grammar file. Use one or the other.
chatllm.llm.grammar=${LLM_GRAMMAR:}
chatllm.llm.grammar-file=${LLM_GRAMMAR_FILE:}
# JSON-schema-constrained output (inline JSON) or path to a JSON file.
chatllm.llm.json-schema=${LLM_JSON_SCHEMA:}
chatllm.llm.json-schema-file=${LLM_JSON_SCHEMA_FILE:}
# DRY sampler sequence breakers (comma-separated tokens that reset the n-gram window).
chatllm.llm.dry-sequence-breaker=${LLM_DRY_SEQUENCE_BREAKER:}

# --- LLM Mirostat ---
chatllm.llm.mirostat=${LLM_MIROSTAT:0}
chatllm.llm.mirostat-lr=${LLM_MIROSTAT_LR:0.1}
chatllm.llm.mirostat-ent=${LLM_MIROSTAT_ENT:5.0}

# --- LLM DRY Sampling ---
chatllm.llm.dry-multiplier=${LLM_DRY_MULTIPLIER:0.0}
chatllm.llm.dry-base=${LLM_DRY_BASE:1.75}
chatllm.llm.dry-allowed-length=${LLM_DRY_ALLOWED_LENGTH:2}
chatllm.llm.dry-penalty-last-n=${LLM_DRY_PENALTY_LAST_N:-1}

# --- LLM XTC ---
chatllm.llm.xtc-probability=${LLM_XTC_PROBABILITY:0.0}
chatllm.llm.xtc-threshold=${LLM_XTC_THRESHOLD:0.1}

# --- LLM Chat & Reasoning ---
chatllm.llm.prompt-template=${LLM_PROMPT_TEMPLATE:}
chatllm.llm.chat-template=${LLM_CHAT_TEMPLATE:}
chatllm.llm.chat-template-kwargs=${LLM_CHAT_TEMPLATE_KWARGS:}
chatllm.llm.jinja=${LLM_JINJA:true}
chatllm.llm.reasoning-format=${LLM_REASONING_FORMAT:auto}
chatllm.llm.reasoning-budget=${LLM_REASONING_BUDGET:128}
chatllm.llm.gpt-oss-reasoning-effort=${LLM_GPT_OSS_REASONING_EFFORT:high}

# --- LLM Server Features ---
chatllm.llm.metrics=${LLM_METRICS:true}
chatllm.llm.webui=${LLM_WEBUI:false}
chatllm.llm.context-shift=${LLM_CONTEXT_SHIFT:false}
chatllm.llm.warmup=${LLM_WARMUP:true}
chatllm.llm.cont-batching=${LLM_CONT_BATCHING:true}
chatllm.llm.timeout=${LLM_TIMEOUT:600}
chatllm.llm.api-key=${LLM_API_KEY:}
# Read API key(s) from a file (one per line). Layered with api-key.
chatllm.llm.api-key-file=${LLM_API_KEY_FILE:}
# URL prefix for all routes (e.g. "/llama" → /llama/v1/completions). Empty = no prefix.
chatllm.llm.api-prefix=${LLM_API_PREFIX:}
# OpenAI-style served-model-name override; empty = derive from model file.
chatllm.llm.alias=${LLM_ALIAS:}
chatllm.llm.slots=${LLM_SLOTS:true}
chatllm.llm.props=${LLM_PROPS:false}
chatllm.llm.slot-prompt-similarity=${LLM_SLOT_PROMPT_SIMILARITY:0.10}
# Directory where slot KV-cache state is saved (for --slots --cache-prompt).
chatllm.llm.slot-save-path=${LLM_SLOT_SAVE_PATH:}
# Bind multiple processes to the same port via SO_REUSEPORT.
chatllm.llm.reuse-port=${LLM_REUSE_PORT:false}
# Suppress the hostname in /props (security).
chatllm.llm.no-host=${LLM_NO_HOST:false}
# Skip remote downloads (--hf-repo, --model-url, --mmproj-url etc.).
chatllm.llm.offline=${LLM_OFFLINE:false}
# Pre-fill behavior when the last message is from the assistant.
chatllm.llm.prefill-assistant=${LLM_PREFILL_ASSISTANT:true}
# Load chat template from a file (overrides --chat-template).
chatllm.llm.chat-template-file=${LLM_CHAT_TEMPLATE_FILE:}
# TLS termination at llama-server (otherwise expose via reverse proxy).
chatllm.llm.ssl-cert-file=${LLM_SSL_CERT_FILE:}
chatllm.llm.ssl-key-file=${LLM_SSL_KEY_FILE:}

# --- LLM Multi-Modal (vision) ---
# Path or URL to the multi-modal projector .gguf for vision-capable models.
chatllm.llm.mmproj=${LLM_MMPROJ:}
chatllm.llm.mmproj-url=${LLM_MMPROJ_URL:}
# Auto-discover an mmproj alongside the main model file.
chatllm.llm.mmproj-auto=${LLM_MMPROJ_AUTO:true}
# Offload mmproj weights to GPU (if main model is on GPU).
chatllm.llm.mmproj-offload=${LLM_MMPROJ_OFFLOAD:true}

# --- LLM CPU Affinity & Scheduling ---
# Generation-time threads (paired with --threads-batch for prompt processing).
chatllm.llm.threads-batch=${LLM_THREADS_BATCH:-1}
# CPU mask (hex) or CPU range ("0-7"). Pick one of mask vs range, not both.
chatllm.llm.cpu-mask=${LLM_CPU_MASK:}
chatllm.llm.cpu-range=${LLM_CPU_RANGE:}
chatllm.llm.cpu-strict=${LLM_CPU_STRICT:0}
# Process priority 0..3 (0 normal, 3 realtime).
chatllm.llm.prio=${LLM_PRIO:0}
# Polling level 0..100 (busy-wait %).
chatllm.llm.poll=${LLM_POLL:50}
# Batch-processing variants (-1 = inherit from non-batch).
chatllm.llm.cpu-mask-batch=${LLM_CPU_MASK_BATCH:}
chatllm.llm.cpu-range-batch=${LLM_CPU_RANGE_BATCH:}
chatllm.llm.cpu-strict-batch=${LLM_CPU_STRICT_BATCH:-1}
chatllm.llm.prio-batch=${LLM_PRIO_BATCH:-1}
chatllm.llm.poll-batch=${LLM_POLL_BATCH:-1}

# --- LLM LoRA ---
chatllm.llm.lora-path=${LLM_LORA_PATH:}
chatllm.llm.lora-scaled=${LLM_LORA_SCALED:}
# Load LoRA adapters but don't apply at startup; clients can opt in per-request.
chatllm.llm.lora-init-without-apply=${LLM_LORA_INIT_WITHOUT_APPLY:false}

# --- LLM RoPE ---
chatllm.llm.rope-scaling=${LLM_ROPE_SCALING:}
chatllm.llm.rope-scale=${LLM_ROPE_SCALE:0.0}
chatllm.llm.rope-freq-base=${LLM_ROPE_FREQ_BASE:0.0}
chatllm.llm.rope-freq-scale=${LLM_ROPE_FREQ_SCALE:0.0}
chatllm.llm.yarn-orig-ctx=${LLM_YARN_ORIG_CTX:0}
chatllm.llm.yarn-ext-factor=${LLM_YARN_EXT_FACTOR:-1.0}
chatllm.llm.yarn-attn-factor=${LLM_YARN_ATTN_FACTOR:-1.0}
chatllm.llm.yarn-beta-slow=${LLM_YARN_BETA_SLOW:-1.0}
chatllm.llm.yarn-beta-fast=${LLM_YARN_BETA_FAST:-1.0}

# --- LLM Speculative Decoding ---
chatllm.llm.model-draft=${LLM_MODEL_DRAFT:}
chatllm.llm.gpu-layers-draft=${LLM_GPU_LAYERS_DRAFT:-1}
chatllm.llm.draft-max=${LLM_DRAFT_MAX:16}
chatllm.llm.draft-min=${LLM_DRAFT_MIN:8}
chatllm.llm.draft-p-min=${LLM_DRAFT_P_MIN:0.8}
# Probability split between draft model and main model when both can produce a token.
chatllm.llm.draft-p-split=${LLM_DRAFT_P_SPLIT:0.1}
# Draft-model context size (0 = inherit from main).
chatllm.llm.ctx-size-draft=${LLM_CTX_SIZE_DRAFT:0}
# Draft-model KV cache types (empty = inherit from main cache-type-{k,v}).
chatllm.llm.cache-type-k-draft=${LLM_CACHE_TYPE_K_DRAFT:}
chatllm.llm.cache-type-v-draft=${LLM_CACHE_TYPE_V_DRAFT:}
# Draft-model device override (e.g. "CUDA1"); empty = use main device list.
chatllm.llm.device-draft=${LLM_DEVICE_DRAFT:}
# Threading for the draft model (-1 = inherit from main threads).
chatllm.llm.threads-draft=${LLM_THREADS_DRAFT:-1}
chatllm.llm.threads-batch-draft=${LLM_THREADS_BATCH_DRAFT:-1}
# MoE-on-CPU for the draft model.
chatllm.llm.cpu-moe-draft=${LLM_CPU_MOE_DRAFT:false}
chatllm.llm.n-cpu-moe-draft=${LLM_N_CPU_MOE_DRAFT:-1}

# --- LLM Connection Pool ---
chatllm.llm.max-connections=${LLM_MAX_CONNECTIONS:4}
chatllm.llm.max-queue-size=${LLM_MAX_QUEUE_SIZE:100}
chatllm.llm.request-timeout=${LLM_REQUEST_TIMEOUT:1800000}
# Idle timeout: fail a generation only if NO traffic from llama-server has been
# seen for this duration. Each streamed token resets the counter, so long
# generations are not capped by absolute elapsed time. (ms)
chatllm.llm.idle-timeout=${LLM_IDLE_TIMEOUT:120000}
chatllm.llm.retry-attempts=${LLM_RETRY_ATTEMPTS:2}
chatllm.llm.retry-delay=${LLM_RETRY_DELAY:1000}
chatllm.llm.conversation-history-limit=${LLM_CONVERSATION_HISTORY_LIMIT:10}
chatllm.llm.context-custom=${LLM_CONTEXT_CUSTOM:}

# --- LLM Paths ---
chatllm.llm.gpu-memory-mb=${GPU_MEMORY_MB:0}
chatllm.llm.models-directory=${MODELS_DIRECTORY:/models}

# --- Agent Pipeline ---
chatllm.agent.default-model=${AGENT_DEFAULT_MODEL:}
chatllm.agent.highlighter-model=${AGENT_HIGHLIGHTER_MODEL:}
chatllm.agent.muse-model=${AGENT_MUSE_MODEL:}
chatllm.agent.narrator-model=${AGENT_NARRATOR_MODEL:}
chatllm.agent.accountant-model=${AGENT_ACCOUNTANT_MODEL:}
chatllm.agent.skeptic-model=${AGENT_SKEPTIC_MODEL:}
chatllm.agent.skeptic-max-retries=${AGENT_SKEPTIC_MAX_RETRIES:2}
chatllm.agent.skeptic-narration-gate-enabled=${AGENT_SKEPTIC_NARRATION_GATE_ENABLED:true}
chatllm.agent.skeptic-character-gate-enabled=${AGENT_SKEPTIC_CHARACTER_GATE_ENABLED:true}
chatllm.agent.caster-model=${AGENT_CASTER_MODEL:}
chatllm.agent.casting-enabled=${AGENT_CASTING_ENABLED:true}

# --- RAG ---
chatllm.rag.enabled=${RAG_ENABLED:true}
chatllm.rag.promotion-enabled=${RAG_PROMOTION_ENABLED:true}
chatllm.rag.promotion-threshold=${RAG_PROMOTION_THRESHOLD:0.7}
chatllm.rag.max-retrieved-entries=${RAG_MAX_RETRIEVED_ENTRIES:15}
chatllm.rag.max-context-tokens=${RAG_MAX_CONTEXT_TOKENS:1500}
chatllm.rag.recency-decay-rate=${RAG_RECENCY_DECAY_RATE:0.02}
chatllm.rag.tag-match-weight=${RAG_TAG_MATCH_WEIGHT:0.35}
chatllm.rag.fulltext-weight=${RAG_FULLTEXT_WEIGHT:0.30}
chatllm.rag.importance-weight=${RAG_IMPORTANCE_WEIGHT:0.20}
chatllm.rag.recency-weight=${RAG_RECENCY_WEIGHT:0.15}

# --- ComfyUI ---
chatllm.comfyui.enabled=${COMFYUI_ENABLED:false}
chatllm.comfyui.host=${COMFYUI_HOST:localhost}
chatllm.comfyui.port=${COMFYUI_PORT:8188}
chatllm.comfyui.output-dir=${COMFYUI_OUTPUT_DIR:./comfyui-output}
chatllm.comfyui.max-queue-size=${COMFYUI_MAX_QUEUE_SIZE:5}
chatllm.comfyui.default-steps=${COMFYUI_DEFAULT_STEPS:20}
chatllm.comfyui.default-checkpoint=${COMFYUI_DEFAULT_CHECKPOINT:}
chatllm.comfyui.default-sampler=${COMFYUI_DEFAULT_SAMPLER:euler_a}

# --- Feature Flags ---
chatllm.features.graphql-playground-enabled=${ENABLE_GRAPHQL_PLAYGROUND:false}

# --- Cache ---
chatllm.cache.settings-ttl=3600
