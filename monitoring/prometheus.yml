global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend metrics (Quarkus serves Micrometer/Prometheus on the main HTTP port)
  - job_name: 'chatllm-backend'
    static_configs:
      - targets: ['backend:8300']
    metrics_path: /metrics

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
