name: Isolated product review
on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
      - name: Install browser and speech test dependencies
        run: |
          cd frontend
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          cd ..
          uv venv .runtime/review-tools/venv --python 3.11
          uv pip install --python .runtime/review-tools/venv/bin/python -r scripts/review/requirements.txt
          uv pip install --python .runtime/review-tools/venv/bin/python torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Run sandbox, review gates and capability short
        env:
          REVIEW_PYTHON: ${{ github.workspace }}/.runtime/review-tools/venv/bin/python
        run: node scripts/review/run.mjs
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-review
          retention-days: 7
          include-hidden-files: true
          # Traces/fixture files can contain test tokens. Publish only curated evidence.
          path: |
            .runtime/review/*/run.json
            .runtime/review/*/browser-results.json
            .runtime/review/*/review-summary.*
            .runtime/review/*/coverage-gaps.json
            .runtime/review/*/video-quality.json
            .runtime/review/*/screenshots/*.png
            .runtime/review/*/accessibility-*.json
            .runtime/review/*/veyloria-short.mp4
