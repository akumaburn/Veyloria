name: Build and test

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Backend Tests
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: chatllm_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Backend Tests
        working-directory: ./backend
        run: |
          ./gradlew clean test
        env:
          RUN_INVENTORY_DB_TESTS: "true"
          DATABASE_HOST: localhost
          DATABASE_PORT: 3306
          DATABASE_NAME: chatllm_test
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload Backend Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/build/test-results/test/*.xml
          retention-days: 7

  # Frontend Tests
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Install Dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Run Linting
        working-directory: ./frontend
        run: bun run lint

      - name: Run Type Check
        working-directory: ./frontend
        run: bun run typecheck

      - name: Run Tests
        working-directory: ./frontend
        run: bun run test -- --run --coverage

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: bun audit

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  # Build Backend
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Backend
        working-directory: ./backend
        run: ./gradlew clean build -x test -Dquarkus.package.jar.type=uber-jar

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/*-runner.jar

  # Build Frontend
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: test-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - name: Install Dependencies
        working-directory: ./frontend
        run: bun install --frozen-lockfile

      - name: Build Frontend
        working-directory: ./frontend
        run: bun run build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          trivyignores: ''
          skip-dirs: '.runtime,.git,frontend/node_modules,backend/build,backend/.gradle'
      
      - name: Upload Security Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-results
          path: trivy-results.sarif
          retention-days: 7

  source-checks:
    name: Documentation and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check publication paths
        run: python3 scripts/check-public-tree.py
      - name: Check local documentation links
        run: python3 scripts/check-docs.py
      - name: Install verified Gitleaks and scan Git history
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --remote-name "$base/$archive"
          curl --fail --silent --show-error --location --remote-name "$base/$checksums"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --log-opts=--all --redact=100 --no-banner

  core-compose-smoke:
    name: Fresh core Compose install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test disposable core services
        run: python3 scripts/review/compose-smoke.py
      - name: Upload core install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-compose-smoke
          retention-days: 7
          include-hidden-files: true
          path: |
            .runtime/review/core-compose-*/result.json
            .runtime/review/core-compose-*/compose.log
