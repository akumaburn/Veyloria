services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: chatllm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chatllm}
      MYSQL_USER: ${MYSQL_USER:-chatllm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-chatllmpass}
    ports:
      # Bind to loopback by default: DB/Redis should not be reachable from the
      # internet. Override with e.g. "0.0.0.0:3307:3306" if remote access is needed.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Apply the application schema + seed data on first boot (fresh volume only).
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks:
      - chatllm-network
    healthcheck:
      # The bootstrap server uses a local socket before schema initialization.
      # Require TCP and an application table so backend startup cannot race it.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --execute='SELECT 1 FROM achievement LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: chatllm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}
    ports:
      # Loopback only by default (see mysql comment).
      - "127.0.0.1:6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - chatllm-network
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    # For an operator-published image, set IMAGE_NAME=<owner>/<repo>
    # and IMAGE_TAG to pull the published image (deploy) instead of building.
    image: ghcr.io/${IMAGE_NAME:-chatllm/chatllm}-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      # Database (Quarkus reactive datasource)
      DATABASE_HOST: mysql
      DATABASE_PORT: 3306
      DATABASE_NAME: ${MYSQL_DATABASE:-chatllm}
      DATABASE_USER: ${MYSQL_USER:-chatllm}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-chatllmpass}
      DATABASE_POOL_SIZE: 20

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispass}

      # JWT (JWT_SECRET is REQUIRED — the backend refuses to start without a
      # strong secret in a production-like environment)
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-14400000}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-604800000}

      # LLM Configuration (off by default; enable via .env)
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_MOCK_MODE: ${LLM_MOCK_MODE:-false}
      LLM_EXTERNAL_SERVER: ${LLM_EXTERNAL_SERVER:-false}
      LLM_EXTERNAL_BASE_URL: ${LLM_EXTERNAL_BASE_URL:-http://host.docker.internal:8080}
      LLM_EXTERNAL_MODEL: ${LLM_EXTERNAL_MODEL:-auto}
      LLM_EXTERNAL_API_KEY: ${LLM_EXTERNAL_API_KEY:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-600}
      LLM_HOST: ${LLM_SERVER_HOST:-host.docker.internal}
      LLM_PORT: ${LLM_SERVER_PORT:-8080}
      LLM_MODEL_PATH: ${LLM_MODEL_PATH:-}

      # Optional external image generation service (host machine by default).
      COMFYUI_ENABLED: ${COMFYUI_ENABLED:-false}
      COMFYUI_HOST: ${COMFYUI_HOST:-host.docker.internal}
      COMFYUI_PORT: ${COMFYUI_PORT:-8188}
      COMFYUI_DEFAULT_CHECKPOINT: ${COMFYUI_DEFAULT_CHECKPOINT:-}

      # Quarkus Server Configuration
      QUARKUS_HTTP_PORT: 8300
      QUARKUS_HTTP_HOST: 0.0.0.0
      DEVELOPMENT_MODE: ${DEVELOPMENT_MODE:-false}
      SHOW_GRAPHQL_ERROR_DETAILS: ${SHOW_GRAPHQL_ERROR_DETAILS:-false}

      # CORS Security
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-80},http://localhost:3000,http://localhost:5173}

      # Rate Limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-200}

      # Environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only: frontend/nginx reach the backend over the compose
      # network. Expose publicly only if you need direct API access.
      - "127.0.0.1:8300:8300"
    volumes:
      - backend-logs:/app/logs
    networks:
      - chatllm-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend Service
  frontend:
    image: ghcr.io/${IMAGE_NAME:-chatllm/chatllm}-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      # VITE_API_URL / VITE_WS_URL are intentionally unset: the frontend
      # derives its GraphQL endpoints from window.location and the Nginx
      # sidecar proxies /graphql (HTTP + WebSocket) to backend:8300. Override
      # here only for cross-origin deployments (e.g. separate API domain).
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
    container_name: chatllm-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - chatllm-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ming Voice Design: model downloaded on first startup, cached across rebuilds.
  tts:
    build:
      context: .
      dockerfile: services/tts/Dockerfile
    restart: unless-stopped
    environment:
      MING_DEVICE: ${MING_DEVICE:-cuda:0}
      MING_MODEL_REVISION: ${MING_MODEL_REVISION:-main}
      TTS_ALLOWED_ORIGINS: ${TTS_ALLOWED_ORIGINS:-http://localhost,http://localhost:${FRONTEND_PORT:-80},http://localhost:3000}
    ports:
      - "127.0.0.1:9797:9797"
    volumes:
      - tts-models:/models
    networks:
      - chatllm-network
    gpus: all
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9797/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30m
      retries: 3

  # Llama.cpp Server (Optional - for LLM)
  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    profiles:
      - llm
    container_name: chatllm-llama
    restart: unless-stopped
    command: |
      --host 0.0.0.0
      --port 8080
      --model /models/${LLM_MODEL_FILE:-model.gguf}
      --ctx-size 4096
      --n-gpu-layers ${GPU_LAYERS:-0}
      --threads ${LLM_THREADS:-4}
      --parallel ${LLM_PARALLEL:-2}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${MODELS_PATH:-./models}:/models:ro
    networks:
      - chatllm-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    # Uncomment for GPU support
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all

  # Prometheus for Monitoring (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: chatllm-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - chatllm-network
    depends_on:
      - backend

  # Grafana for Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: chatllm-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    ports:
      - "127.0.0.1:3005:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro
    networks:
      - chatllm-network
    depends_on:
      - prometheus

  # Nginx Reverse Proxy (Optional - for production)
  # nginx:
  #   image: nginx:alpine
  #   container_name: chatllm-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   networks:
  #     - chatllm-network
  #   depends_on:
  #     - frontend
  #     - backend

networks:
  chatllm-network:
    driver: bridge

volumes:
  backend-logs:
    driver: local
  tts-models:
    driver: local
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local